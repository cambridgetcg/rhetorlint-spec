name: release

# Publishing should not depend on which device anyone is sitting at.
#
# The interactive path (scripts/publish-npm-interactive.zsh) stays exactly as it
# is and remains the fallback — it is the right tool for a human with a security
# key. This is the other door: tag a release, and the packages the registry does
# not have yet go out on their own.
#
# Authentication is npm Trusted Publishing (OIDC). No npm token is stored in
# this repository. See NPM_DEPLOY.md for the one-time setup on npmjs.com.

on:
  push:
    tags:
      - "v*"
      - "release-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve versions and report what would publish, without publishing"
        type: boolean
        default: false

# One release at a time. Two tags pushed together would otherwise run two
# publish jobs against the same versions, and whichever lost the race would see
# a duplicate-version 403 for work it thought was its own. Queued, never
# cancelled: a publish stopped midway leaves the registry holding some of the
# three packages and not the others, and npm versions are immutable.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing reaches the registry that has not reproduced across all three
  # engines first. The publish job cannot start unless this one is green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: run the JS reference-engine test suite (zero dependencies)
        run: npm test
      - name: run the demo
        run: node scripts/demo.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cross-engine conformance — the Python engine must match the JS ground truth
        run: python3 impl/python/test_conformance.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: cross-engine conformance — the Go engine must match the JS ground truth
        working-directory: impl/go
        run: go test ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Restored after the 2026-07-24 diagnostic: runs with and without this
    # line failed IDENTICALLY ("OIDC token exchange error - package not
    # found"), so the environment claim is not the variable — a package
    # simply has no trusted-publisher record until a human registers one for
    # THAT package (per-package, never per-scope). Keeping it costs nothing
    # and buys the optional human-approval gate on the GitHub side.
    #
    # Still unproven end to end: no release has yet completed an OIDC
    # exchange. core 0.1.2 and rules-en 0.1.1 went out by hand. The first
    # package whose publisher is genuinely registered will settle it.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance attestation
    steps:
      - uses: actions/checkout@v4
      # Deliberately NO `registry-url:` here. Setting it makes setup-node write
      # an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and with no token
      # supplied that resolves to the literal placeholder XXXXX-XXXXX-XXXXX-XXXXX.
      # npm then authenticates with that garbage instead of falling through to
      # OIDC, and the registry answers 404 (its mask for "not authorized").
      # Trusted publishing needs npm to find NO credential at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      # Pinned to the 11 line rather than `latest`: this job holds id-token:
      # write, and an unpinned install means the same commit publishes under
      # whichever npm major happens to be current on the day it runs. The
      # caret keeps patches to the OIDC exchange, not a new major's semantics.
      - name: install an npm new enough to publish without a token
        run: npm install -g "npm@^11.5.1" && npm --version
      - name: publish the packages the registry does not have yet
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish-npm-ci.mjs
