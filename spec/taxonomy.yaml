# ============================================================================
# RhetorLint taxonomy — the human-readable core of the spec
# ============================================================================
#
# This ONE file does two jobs at once:
#
#   1. PORTABLE TAXONOMY (engines read it).  It is the canonical catalogue that
#      per-locale rule packs compile against.  Every `id` under `tells` matches a
#      ruleId in packages/rules-*/rules.json; every `family` matches the fixed
#      enum in spec/output.schema.json.  Change a family or a rule id here and the
#      compiled packs change with it.
#
#   2. SYLLABUS (learners read it).  It is the curriculum for the learning wing.
#      Each marker is one lesson: the visible pattern, a CONTESTABLE hypothesis
#      about a possible effect, applicability limits, and an evidence question.
#
# ----------------------------------------------------------------------------
# THE REFUSAL STANCE — read this before you read anything else.
# ----------------------------------------------------------------------------
# RhetorLint marks configured patterns in the WORDS. The matched span and
# position are surface observations; the rule ID, family, technique, note, and
# review fields are versioned rule-pack interpretations.
#   * It does NOT read the person. No marker field may become a claim about the
#     speaker's mind, motive, or honesty.
#   * It does NOT detect lies. A marked passage may be perfectly true; an unmarked
#     one may be false. RhetorLint measures how the language is BUILT, not whether
#     the claim is correct.
#   * An `effect_hypothesis` is a question to test for a declared recipient,
#     substrate, task, and context. It is NOT evidence that an effect occurred.
#   * `confidence` is an uncalibrated, author-assigned match weight, NOT a
#     probability of intent, effect, deception, or truth.
# Every mark points at a phrase a reader can see and re-read for themselves. A
# match can be benign, quoted, conventional, necessary, or contextually wrong.
# Alternative readings and disagreement stay live.
#
# ----------------------------------------------------------------------------
# PROVENANCE — label lineage, not matcher or effect validation.
# ----------------------------------------------------------------------------
# The six coarse families are the six coarse persuasion strategies of
# SemEval-2023 Task 3 (Piskorski, Stefanovitch, Da San Martino & Nakov, 2023;
# ACL Anthology 2023.semeval-1.317), whose 23 fine techniques nest 5+5+3+3+3+4
# under those six parents. That taxonomy descends directly from:
#   * Da San Martino et al. 2019, "Fine-Grained Analysis of Propaganda in News
#     Articles" (EMNLP-IJCNLP, D19-1565) — the 18-technique Propaganda Techniques
#     Corpus (PTC); then
#   * SemEval-2020 Task 11 (Da San Martino et al.) — consolidated to 14 techniques
#     (Straw Man / Red Herring folded into Whataboutism, etc.); then
#   * SemEval-2023 Task 3 (Piskorski et al.) — re-expanded to the 23 fine / 6
#     coarse taxonomy this file aligns to.
#
# ONE family is RhetorLint's OWN structural extension, NOT in SemEval: the
# `agency-hiding` family and its single tell. It is mapped to its nearest SemEval
# kin so the map stays honest, and the label it puts on the wire says so out
# loud — "Obfuscation (structural — RhetorLint extension)" — so a researcher
# grouping marks by `technique` can never mistake it for a SemEval technique.
#
# `contrition.rehearsed` is a different case and the difference matters. The
# PATTERN is RhetorLint's; the TECHNIQUE is not. SemEval has no fine technique
# for rehearsed corporate contrition, so the rule is filed under the nearest one
# that does exist and ships that label verbatim. Consequence, stated plainly:
# grouping output by `technique` folds this tell in with the other Obfuscation
# tells — correct against SemEval, but it disappears as a category. Group by
# `ruleId` to see it on its own.
#
# NOTE ON VERBATIM LABELS: `semeval_technique` holds the technique names as
# published by the SemEval-2023 Task 3 organizers — and, for the one structural
# tell SemEval has no technique for, the suffixed label RhetorLint emits in their
# place. Either way the value is the string the compiled packs put on the wire,
# character for character: packages/rules-en/rules.json respells none of them, so
# a mark's `technique` joins straight back to this file. One label is normalised
# here and in the packs alike: the organizers' page writes "Obfuscation -
# vagueness or confusion" where this taxonomy writes "Obfuscation, Intentional
# Vagueness, Confusion". That single string is the one a researcher must map back
# before joining RhetorLint output to a SemEval corpus. Labels were confirmed
# against the organizers' task page and the ACL 2023 paper. The lineage does not
# validate RhetorLint's regexes, generic-domain interpretations, or effects.
#
# `mapping_status` describes only the relationship between a RhetorLint rule
# concept and this lineage: `aligned-candidate`, `approximate-candidate`, or
# `rhetorlint-extension`. Both candidate values still require context; neither
# says that a particular matched use instantiates the named technique.
# ============================================================================

version: "0.1"
aligned_to: "SemEval-2023 Task 3 (Piskorski et al. 2023); lineage: Da San Martino et al. 2019 → SemEval-2020 Task 11"
license: "CC-BY-SA-4.0"   # the taxonomy corpus is teachable & shareable

families:

  # ==========================================================================
  # 1. MANIPULATIVE WORDING  — the volume and vagueness of the language itself
  # ==========================================================================
  - id: manipulative-wording
    semeval_parent: "Manipulative Wording"
    what: "Word choices that can alter emphasis, specificity, attribution, or framing separately from whatever facts are (or aren't) present."
    seeded_tells: 7
    semeval_siblings_not_yet_seeded: ["Repetition"]
    tells:

      - id: intensifier.loaded
        display_name: "intensifier"
        semeval_technique: "Loaded Language"
        mapping_status: "aligned-candidate"
        what: "An intensifier — an adverb or adjective that adds emphasis without adding evidence."
        effect_hypothesis: "May increase attention, recall, or expressed certainty when a recipient treats the emphasis as informative."
        verification_probe: "Does removing only the intensifier change confidence, attention, or evidence requests under the same task conditions?"
        examples:
          - marked: "We take your privacy extremely seriously"
            marker: "extremely"
            verification_prompt: "What observable practices and evidence support the stated degree of seriousness?"
          - marked: "This is a hugely successful program"
            marker: "hugely"
            verification_prompt: "Which outcome measure defines success, and what result was observed?"
        lineage: "SemEval-2023 · Manipulative Wording › Loaded Language"

      - id: hedge.softener
        display_name: "qualifier or distancing phrase"
        semeval_technique: "Obfuscation, Intentional Vagueness, Confusion"   # organizers' page: "Obfuscation - vagueness or confusion"
        mapping_status: "approximate-candidate"
        what: "A qualifier or distancing phrase that can leave a commitment less specific."
        effect_hypothesis: "May lead recipients to extract a weaker commitment when the phrase modifies a promise, obligation, action, or factual assertion."
        verification_probe: "What concrete action, actor, deadline, or uncertainty does the surrounding context establish?"
        examples:
          - marked: "We believe this will fix the issue for most people"
            marker: "We believe"
            verification_prompt: "Which issue is expected to be fixed, for whom, and what evidence supports that expectation?"
          - marked: "We're reaching out to some affected users"
            marker: "reaching out to"
            verification_prompt: "Which users were contacted, by what channel, and when?"
        lineage: "SemEval-2023 · Manipulative Wording › Obfuscation, Intentional Vagueness, Confusion"

      - id: hedge.deniable
        display_name: "epistemic modal or attribution cue"
        semeval_technique: "Obfuscation, Intentional Vagueness, Confusion"
        mapping_status: "approximate-candidate"
        what: "An epistemic modal or attribution cue — may / might / could + verb, or reportedly / allegedly — that marks possibility or qualified sourcing."
        effect_hypothesis: "May cause recipients to treat a proposition as possible or attributed rather than established; that qualification can also be epistemically necessary."
        verification_probe: "What supports the possibility, and what evidence would resolve the stated uncertainty?"
        examples:
          - marked: "Your data may have been exposed"
            marker: "may have been"
            verification_prompt: "Which data may have been exposed, on what evidence, and what would confirm or rule it out?"
          - marked: "The outage could potentially affect some regions"
            marker: "could potentially"
            verification_prompt: "Which regions are possible, on what basis, and what observation would confirm impact?"
        lineage: "SemEval-2023 · Manipulative Wording › Obfuscation, Intentional Vagueness, Confusion"

      - id: weasel.attribution
        display_name: "unnamed-source attribution"
        semeval_technique: "Obfuscation, Intentional Vagueness, Confusion"
        mapping_status: "approximate-candidate"
        # NOTE: the marked thing is the *unnamed source* wording ("experts say",
        # "studies show") — vagueness of source, which is Manipulative Wording.
        # A NAMED authority ("Dr. X, a Nobel laureate, says") would instead be
        # SemEval's "Appeal to Authority" under the Justification parent — a
        # different, future tell. family and technique agree here on purpose.
        what: "An attribution to a source that is not identified in the matched phrase."
        effect_hypothesis: "May make it harder to inspect the authority, sample, or evidence when no source appears nearby."
        verification_probe: "Which source makes this claim, and what evidence and method does that source provide?"
        examples:
          - marked: "Experts agree this is safe"
            marker: "Experts agree"
            verification_prompt: "Which experts, evaluating what safety evidence, agree?"
          - marked: "Studies show our method works"
            marker: "Studies show"
            verification_prompt: "Which studies, methods, samples, and results support the claim?"
        lineage: "SemEval-2023 · Manipulative Wording › Obfuscation (unnamed source; cf. Justification › Appeal to Authority for a named one)"

      - id: lure.free-offer
        display_name: "zero-cost or all-inclusive claim"
        semeval_technique: "Exaggeration or Minimisation"
        mapping_status: "aligned-candidate"
        what: "A zero-cost or all-inclusive claim — 'absolutely free', 'no strings attached', 'everything you need' — whose matched phrase does not show the full terms."
        effect_hypothesis: "May reduce attention to conditions, future charges, data exchange, attention costs, or exclusions when those exist."
        verification_probe: "What price, conditions, exclusions, later charges, data uses, or other exchanges accompany the offer?"
        examples:
          - marked: "Get started absolutely free, no strings attached"
            marker: "absolutely free"
            verification_prompt: "What is free, for how long, and what terms or non-price exchanges apply?"
          - marked: "Everything you need to launch your business"
            marker: "everything you need"
            verification_prompt: "What is included, what is excluded, and whose needs define 'everything'?"
        lineage: "SemEval-2023 · Manipulative Wording › Exaggeration or Minimisation"

      - id: shouting.caps
        display_name: "sustained all-caps"
        semeval_technique: "Loaded Language"
        mapping_status: "approximate-candidate"
        what: "Sustained ALL-CAPS — two or more consecutive words given typographic emphasis. (The one case-sensitive rule in the pack.)"
        effect_hypothesis: "May increase visual priority, perceived urgency, or recall when the capitals function as emphasis rather than convention."
        verification_probe: "Does changing only letter case alter prioritisation, urgency, or evidence requests?"
        examples:
          - marked: "LIMITED TIME OFFER for our members"
            marker: "LIMITED TIME OFFER"
            verification_prompt: "What is the verified deadline, and what changes after it?"
        lineage: "SemEval-2023 · Manipulative Wording › Loaded Language"

      - id: contrition.rehearsed
        display_name: "stock contrition phrase"
        semeval_technique: "Obfuscation, Intentional Vagueness, Confusion"
        mapping_status: "approximate-candidate"
        # RhetorLint-AUTHORED PATTERN, EXISTING SemEval TECHNIQUE. SemEval names no
        # technique for rehearsed contrition, so the rule ships the label of its
        # nearest kin rather than inventing one — which keeps `technique` joinable
        # to a SemEval corpus at the cost of hiding this tell inside the
        # Obfuscation bucket. Group by `ruleId` to recover it.
        what: "A stock contrition phrase whose matched span names no specific act or remedy."
        effect_hypothesis: "May let a recipient recognise the form of contrition while extracting little accountability detail when specifics are absent from the surrounding statement."
        verification_probe: "Where does the statement identify what happened, who acted, who was affected, and what remedy is verifiably underway?"
        examples:
          - marked: "We take your security seriously and apologize for any inconvenience"
            marker: "we take your security seriously"
            verification_prompt: "What happened, who acted, who was affected, and what remedy is supported by evidence?"
        lineage: "SemEval-2023 · Manipulative Wording › Obfuscation, Intentional Vagueness, Confusion (RhetorLint-authored pattern under a SemEval technique)"

  # ==========================================================================
  # 2. SIMPLIFICATION  — collapsing a complex reality into one option / cause / certainty
  # ==========================================================================
  - id: simplification
    semeval_parent: "Simplification"
    what: "Patterns that can present a complex reality as one option, cause, or certainty."
    seeded_tells: 1
    semeval_siblings_not_yet_seeded: ["Causal Oversimplification", "Consequential Oversimplification"]
    tells:

      - id: absolute.universal
        display_name: "absolute or certainty cue"
        semeval_technique: "False Dilemma or No Choice"
        mapping_status: "approximate-candidate"
        # The marked words split two ways: "only option / no choice" is squarely
        # False Dilemma; "obviously / everyone knows / undeniable" also brushes
        # SemEval's Conversation Killer (thought-terminating). RhetorLint marks the
        # visible absolute either way.
        what: "An absolute quantifier or certainty cue — always / never / everyone / obviously / the only option — that states an unrestricted scope."
        effect_hypothesis: "May reduce the alternatives or exceptions a recipient considers when the phrase describes a contestable empirical claim rather than a rule or invariant."
        verification_probe: "What domain does the universal cover, what exceptions are known, and what evidence supports that scope?"
        examples:
          - marked: "Everyone knows this is the only option"
            marker: "the only option"
            verification_prompt: "Which alternatives were considered, and what evidence eliminates them?"
          - marked: "This will always be free"
            marker: "always"
            verification_prompt: "What policy, enforceable commitment, and change conditions support 'always'?"
        lineage: "SemEval-2023 · Simplification › False Dilemma or No Choice"

  # ==========================================================================
  # 3. DISTRACTION  — moving your attention off the question actually on the table
  # ==========================================================================
  - id: distraction
    semeval_parent: "Distraction"
    what: "Patterns that may redirect attention from a prior question to a comparison or different issue."
    seeded_tells: 1
    semeval_siblings_not_yet_seeded: ["Straw Man", "Red Herring"]
    tells:

      - id: deflection.whataboutism
        display_name: "comparison or topic-shift cue"
        semeval_technique: "Whataboutism"
        mapping_status: "aligned-candidate"
        what: "A comparison or topic-shift cue whose interpretation depends on the preceding dialogue."
        effect_hypothesis: "May redirect attention when used in a response and the comparison does not answer the prior question."
        verification_probe: "What was the prior question, does this comparison answer it, and is the comparison independently relevant?"
        examples:
          - marked: "What about our competitors' leaks?"
            marker: "What about"
            verification_prompt: "What prior question is being answered, and how is the competitor comparison relevant?"
          - marked: "But what about the last administration's record?"
            marker: "But what about"
            verification_prompt: "Does the comparison answer the current claim, or introduce a separate one requiring its own evidence?"
        lineage: "SemEval-2023 · Distraction › Whataboutism"

  # ==========================================================================
  # 4. ATTACK ON REPUTATION  — language about a person or group, not the claim
  #    (no seed rule yet — shown so the curriculum map is complete)
  # ==========================================================================
  - id: attack-on-reputation
    semeval_parent: "Attack on Reputation"
    what: "Techniques that discuss a person or group rather than directly engaging with the proposition at issue."
    status: "(no seed rule yet)"
    why_not_seeded: "Reputation attacks usually need a target and context to be read correctly ('is this a slur or a description?'). That is exactly the intent-modelling RhetorLint's deterministic, words-only core refuses to do, so these await a carefully-scoped pack."
    semeval_techniques:
      - name: "Name Calling or Labelling"
        what: "Applying a loaded label to a target; context is needed to determine its relevance and effect."
      - name: "Guilt by Association"
        what: "Associating a target with a disliked group or figure."
      - name: "Doubt"
        what: "Questioning someone's credibility or sincerity; any supporting evidence must be inspected separately."
      - name: "Appeal to Hypocrisy"
        what: "Raising an alleged inconsistency in the arguer instead of or alongside evaluating the proposition."
      - name: "Questioning the Reputation"
        what: "Questioning a target's standing; test whether and why this changes evaluation of the target's claims."
    lineage: "SemEval-2023 · Attack on Reputation (5 fine techniques)"

  # ==========================================================================
  # 5. JUSTIFICATION  — presenting an external appeal as support
  #    (no seed rule yet)
  # ==========================================================================
  - id: justification
    semeval_parent: "Justification"
    what: "Presenting an outside appeal — authority, popularity, shared values, fear, or affiliation — as support. Whether it substitutes for evidence depends on context."
    status: "(no seed rule yet)"
    note: "RhetorLint's legacy weasel.attribution ID touches SemEval's Appeal to Authority, but files the unnamed-source marker under manipulative-wording. A dedicated justification pack (crowd, values, fear, flag) is future work."
    semeval_techniques:
      - name: "Flag Waving"
        what: "Invoking group loyalty or patriotism in support of a claim."
      - name: "Appeal to Authority"
        what: "Citing an authority as support; the authority's evidence and relevant expertise remain independently inspectable."
      - name: "Appeal to Popularity"
        what: "Presenting popularity or widespread practice as a reason to agree."
      - name: "Appeal to Values"
        what: "Connecting a claim to shared or cherished values."
      - name: "Appeal to Fear/Prejudice"
        what: "Associating a feared outcome or prejudicial framing with an alternative."
    lineage: "SemEval-2023 · Justification (5 fine techniques)"

  # ==========================================================================
  # 6. CALL  — pushing you toward an action or shutting thought down
  # ==========================================================================
  - id: call
    semeval_parent: "Call"
    what: "Patterns that call for action, foreground a deadline, or use discussion-closing language."
    seeded_tells: 1
    semeval_siblings_not_yet_seeded: ["Slogans", "Conversation Killer"]
    tells:

      - id: urgency.appeal-to-time
        display_name: "time-pressure cue"
        semeval_technique: "Appeal to Time"
        mapping_status: "aligned-candidate"
        what: "A time-pressure cue — 'act now', 'limited time', 'last chance' — that calls for action or foregrounds a deadline."
        effect_hypothesis: "May cause a recipient to prioritise immediate action over verification when the deadline or hazard is not already established."
        verification_probe: "What independently verifiable deadline or hazard exists, and what actually happens if action waits?"
        examples:
          - marked: "Act now — this offer won't last!"
            marker: "Act now"
            verification_prompt: "What is the verified deadline, and what consequence follows from waiting?"
          - marked: "Last chance to lock in this rate"
            marker: "Last chance"
            verification_prompt: "Which rate changes, when, for whom, and according to what binding terms?"
        lineage: "SemEval-2023 · Call › Appeal to Time"
    semeval_techniques_not_yet_seeded:
      - name: "Slogans"
        what: "A short, memorable phrase used as an argument cue; inspect the accompanying basis separately."
      - name: "Conversation Killer"
        what: "A cliché such as 'it is what it is' that may reduce continuation of a discussion."
    lineage: "SemEval-2023 · Call (3 fine techniques)"

  # ==========================================================================
  # 7. AGENCY-HIDING  — grammar that can omit who did the thing
  #    RHETORLINT STRUCTURAL EXTENSION — not a SemEval family.
  # ==========================================================================
  - id: agency-hiding
    semeval_parent: "(RhetorLint extension — not in SemEval)"
    what: "Sentence structure that omits the semantic agent: an action is described, but the matched phrase does not name who performed it."
    why_extension: "SemEval's taxonomy is lexical/rhetorical; RhetorLint adds one structural family for candidate passive constructions with omitted agents. This is a heuristic grammatical classification, not proof that the classification is correct in context or that attribution was intentionally hidden. Its nearest SemEval kin is Manipulative Wording › Obfuscation."
    seeded_tells: 1
    tells:

      - id: agency-hiding.deleted-subject
        display_name: "passive with omitted semantic agent"
        semeval_technique: "Obfuscation (structural — RhetorLint extension)"
        mapping_status: "rhetorlint-extension"
        # NOT a SemEval technique. The parenthesis is load-bearing: it keeps the
        # label off SemEval's Obfuscation bucket, so a technique-level join to a
        # SemEval corpus drops this tell rather than silently absorbing it.
        what: "A passive construction with an omitted agent — 'mistakes were made', 'your account was closed'. The patient can still be the grammatical subject; the phrase does not name the actor."
        effect_hypothesis: "May make actor identification or responsibility attribution harder when the actor is not named nearby and attribution matters to the task."
        verification_probe: "Who performed the action, is that actor known, and what evidence supports the attribution?"
        examples:
          - marked: "Mistakes were made and your account was closed"
            marker: "Mistakes were made"
            verification_prompt: "Who made which mistakes, and what evidence identifies the actor?"
          - marked: "Your data was shared with partners"
            marker: "was shared"
            verification_prompt: "Who shared which data with which partners, and what records establish that?"
        lineage: "RhetorLint structural extension · nearest SemEval kin: Manipulative Wording › Obfuscation, Intentional Vagueness, Confusion"
